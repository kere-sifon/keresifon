apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deploy everything with:  kubectl apply -k k8s/
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/name: keresifon
  app.kubernetes.io/part-of: portfolio

# Override the image tag centrally, e.g. via CI:
#   kustomize edit set image ghcr.io/kere-sifon/keresifon=ghcr.io/kere-sifon/keresifon:<sha>
images:
  - name: ghcr.io/kere-sifon/keresifon
    newTag: dev
