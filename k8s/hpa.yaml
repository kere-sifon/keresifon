apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: keresifon
  labels:
    app: keresifon
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: keresifon
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
