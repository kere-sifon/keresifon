apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keresifon
  labels:
    app: keresifon
  annotations:
    # Adjust for your ingress controller / cert-manager setup.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - keresifon.com
        - www.keresifon.com
      secretName: keresifon-tls
  rules:
    - host: keresifon.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keresifon
                port:
                  number: 80
    - host: www.keresifon.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keresifon
                port:
                  number: 80
