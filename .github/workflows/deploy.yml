name: Deploy

# Build, push to the homelab Nexus registry, and roll out to homelab-k8s.
# One-time setup (namespace, pull secret, RBAC, GitHub secrets): deploy/ci/README.md.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag to roll out (skips build). Blank = build current commit."
        required: false
        default: ""

# One deploy at a time; a newer push waits rather than racing the rollout.
concurrency:
  group: deploy-homelab-keresifon
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Self-hosted runner on the home LAN (gh-runner-02). GitHub-hosted runners can't reach Nexus or the cluster.
    runs-on: [self-hosted, linux, x64, homelab]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Nexus
        run: echo "${{ secrets.NEXUS_PUSH_PASSWORD }}" | docker login nexus-lan.keresifon.com -u "${{ secrets.NEXUS_PUSH_USER }}" --password-stdin

      - name: Kubeconfig (github-deployer, keresifon namespace only)
        run: |
          mkdir -p "$RUNNER_TEMP/kube"
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 --decode > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"

      - name: Build, push and roll out
        env:
          # github-deployer cannot touch Secrets/Namespaces; those are managed from the Mac.
          SYNC_SECRETS: "0"
          TAG: ${{ github.event.inputs.tag }}
        run: |
          chmod +x deploy/deploy.sh
          if [ -n "$TAG" ]; then deploy/deploy.sh apply; else unset TAG; deploy/deploy.sh all; fi

      - name: Show state on failure
        if: failure()
        run: |
          kubectl -n keresifon get pods -o wide || true
          kubectl -n keresifon get events --sort-by=.lastTimestamp | tail -20 || true

      - name: Clean up credentials
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/kube"
          docker logout nexus-lan.keresifon.com || true
